<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Portal Universitário — Navegador com correção automática de downloads DOCX para Android e Web.">

  <!-- Open Graph / Vercel SEO -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Portal Universitário — Navegador & DOCX Repair">
  <meta property="og:description" content="Solução completa para acessar portais universitários e corrigir arquivos Word baixados como .xml ou .bin.">
  <meta property="og:theme-color" content="#0D1117">

  <!-- Mobile meta tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Portal Universitário">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Portal Universitário — Navegador & DOCX Repair</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0D1117;
      color: #FFFFFF;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
      background: rgba(22, 27, 34, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      max-width: 380px;
      width: 85%;
    }

    .spinner-ring {
      width: 54px;
      height: 54px;
      border: 4px solid rgba(79, 195, 247, 0.15);
      border-top: 4px solid #1A73E8;
      border-right: 4px solid #4FC3F7;
      border-radius: 50%;
      animation: spin 1s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
      margin-bottom: 24px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .app-title {
      font-size: 20px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }

    .app-subtitle {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      background: rgba(26, 115, 232, 0.15);
      border: 1px solid rgba(26, 115, 232, 0.3);
      border-radius: 20px;
      color: #4FC3F7;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="spinner-ring"></div>
    <div class="app-title">Portal Universitário</div>
    <div class="app-subtitle">Carregando navegador e corretor de downloads DOCX...</div>
    <div class="badge">PRONTO PARA VERCEL & ANDROID</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
