<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description"
    content="Portal Universitário — Navegador com correção automática de downloads DOCX para Android e Web.">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Portal Universitário — Navegador & DOCX Repair">
  <meta property="og:description"
    content="Solução completa para acessar portais universitários e corrigir arquivos Word baixados como .xml ou .bin.">
  <meta property="og:theme-color" content="#0D1117">

  <!-- Mobile -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Portal Universitário">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Portal Universitário — Navegador & DOCX Repair</title>

  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      background: #0D1117;
    }

    html {
      overflow: auto;
    }

    body {
      color: #FFFFFF;
      font-family:
        'Outfit',
        -apple-system,
        BlinkMacSystemFont,
        'Segoe UI',
        Roboto,
        sans-serif;

      overflow: auto;
      overscroll-behavior: auto;
    }

    /*
     * Tela de carregamento.
     *
     * position: fixed evita alterar o layout do Flutter.
     */
    #loading-wrapper {
      position: fixed;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #0D1117;

      z-index: 9999;
    }

    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      box-sizing: border-box;

      text-align: center;

      padding: 32px;

      background: rgba(22, 27, 34, 0.7);

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);

      border: 1px solid rgba(255, 255, 255, 0.1);

      border-radius: 24px;

      box-shadow:
        0 20px 40px rgba(0, 0, 0, 0.4);

      max-width: 380px;

      width: calc(100% - 32px);
    }

    .spinner-ring {
      width: 54px;
      height: 54px;

      border: 4px solid rgba(79, 195, 247, 0.15);
      border-top: 4px solid #1A73E8;
      border-right: 4px solid #4FC3F7;

      border-radius: 50%;

      animation:
        spin 1s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;

      margin-bottom: 24px;
    }

    from {
      transform: rotate(0deg);
    }

    to {
      transform: rotate(360deg);
    }
    

    .app-title {
      font-size: 20px;
      font-weight: 700;

      color: #FFFFFF;

      margin-bottom: 6px;

      letter-spacing: -0.3px;
    }

    .app-subtitle {
      font-size: 13px;

      color: rgba(255, 255, 255, 0.6);

      margin-bottom: 16px;

      line-height: 1.4;
    }

    .badge {
      display: inline-flex;

      align-items: center;

      padding: 4px 12px;

      background: rgba(26, 115, 232, 0.15);

      border:
        1px solid rgba(26, 115, 232, 0.3);

      border-radius: 20px;

      color: #4FC3F7;

      font-size: 11px;
      font-weight: 600;

      letter-spacing: 0.5px;
    }
  </style>

  <script
  type="application/javascript"
  src="/assets/packages/flutter_inappwebview_web/assets/web/web_support.js"
  defer>
</script>
</head>

<body>

  <div id="loading-wrapper">

    <div id="loading-container">

      <div class="spinner-ring"></div>

      <div class="app-title">
        Portal Universitário
      </div>

      <div class="app-subtitle">
        Carregando navegador e corretor de downloads DOCX...
      </div>

      <div class="badge">
        PRONTO PARA VERCEL & ANDROID
      </div>

    </div>

  </div>

  <script>
    /*
     * Remove a tela de loading quando o Flutter
     * inserir sua view na página.
     */
    const observer = new MutationObserver(() => {

      const flutterView =
        document.querySelector('flutter-view');

      if (!flutterView) {
        return;
      }

      const loading =
        document.getElementById('loading-wrapper');

      if (loading) {
        loading.remove();
      }

      observer.disconnect();
    });

    observer.observe(
      document.body, {
        childList: true,
        subtree: true
      }
    );
  </script>

  <script src="flutter_bootstrap.js" async>
  </script>

</body>

</html>
